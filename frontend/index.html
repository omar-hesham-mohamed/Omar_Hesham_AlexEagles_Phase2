<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My To-Do List</h1>
            <button id="theme-toggle" class="theme-toggle">🌙 Dark Mode</button>
        </header>
        
        <div class="add-task-section">
            <input type="text" id="task-input" placeholder="Enter a new task..." maxlength="200">
            <button id="add-task-btn" class="add-btn">Add Task</button>
        </div>
        
        <div class="tasks-section">
            <div class="tasks-header">
                <h2>Tasks</h2>
                <div class="task-stats">
                    <span id="total-tasks">0</span> total, 
                    <span id="completed-tasks">0</span> completed
                </div>
            </div>
            <ul id="tasks-list" class="tasks-list">
                <!-- Tasks will be dynamically added here -->
            </ul>
        </div>
        
        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
